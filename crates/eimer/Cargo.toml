[package]
name = "eimer"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
ctrlc = "3.5.2"
dialoguer = "0.12.0"
getrandom = "0.3"
hex = "0.4.3"
indicatif = "0.18.6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
terminal_size = "0.4.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
