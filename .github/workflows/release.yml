name: Release
# On every push to main: version pending changesets with the Changesets CLI, commit the release
# metadata to main as the release App, and tag each release unit (eimerreis/devops ADR-0009).
# - eimer: the `eimer/v<version>` tag starts "Release eimer", which builds and publishes binaries.
# - @scripts/release: published to Azure Artifacts as @tapio/release by the publish-release job.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Version release units
    # The release commit itself must not start another release.
    if: github.actor != 'eimerreis-release[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      released: ${{ steps.prepare.outputs.released }}
      eimer_version: ${{ steps.prepare.outputs.eimer_version }}
      release_version: ${{ steps.prepare.outputs.release_version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Version pending changesets
        id: prepare
        run: bun scripts/release.ts prepare

      - name: Commit, tag and push
        if: steps.prepare.outputs.released == 'true'
        env:
          EIMER_VERSION: ${{ steps.prepare.outputs.eimer_version }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name "eimerreis-release[bot]"
          git config user.email "353283402+eimerreis-release[bot]@users.noreply.github.com"

          units=()
          tags=()
          if [ -n "$EIMER_VERSION" ]; then units+=("eimer ${EIMER_VERSION}"); tags+=("eimer/v${EIMER_VERSION}"); fi
          if [ -n "$RELEASE_VERSION" ]; then units+=("@tapio/release ${RELEASE_VERSION}"); tags+=("release/v${RELEASE_VERSION}"); fi
          summary="$(printf '%s, ' "${units[@]}")"
          summary="${summary%, }"

          git add -A
          git commit -m "chore(release): ${summary}"
          for tag in "${tags[@]}"; do git tag "$tag"; done
          git push origin "HEAD:${GITHUB_REF_NAME}"
          for tag in "${tags[@]}"; do git push origin "$tag"; done

  publish-release:
    name: Publish @tapio/release
    needs: prepare
    if: needs.prepare.outputs.release_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tapioone-azdevops
    permissions:
      contents: write
    env:
      RELEASE_PACKAGE_NAME: "@tapio/release"
      NPM_SCOPE: "@tapio"
      AZDEVOPS_ORGANIZATION: ${{ secrets.AZDEVOPS_ORGANIZATION }}
      AZDEVOPS_PACKAGEFEED: ${{ secrets.AZDEVOPS_PACKAGEFEED }}
      AZDEVOPS_PROJECT: ${{ secrets.AZDEVOPS_PROJECT }}
      AZDEVOPS_PAT: ${{ secrets.AZDEVOPS_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/v${{ needs.prepare.outputs.release_version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build publish bundle
        run: bun build packages/release/src/index.ts --outdir packages/release/dist --target bun

      - name: Prepare publish package
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare.outputs.release_version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          rm -rf publish
          mkdir -p publish
          cp -R packages/release/dist publish/dist
          cp packages/release/README.md publish/README.md
          if [ -f packages/release/CHANGELOG.md ]; then
            cp packages/release/CHANGELOG.md publish/CHANGELOG.md
          fi

          VERSION="$VERSION" RELEASE_PACKAGE_NAME="$RELEASE_PACKAGE_NAME" bun --eval '
            const sourcePath = "packages/release/package.json";
            const outPath = "publish/package.json";
            const source = JSON.parse(await Bun.file(sourcePath).text());
            const releasePackageName = process.env.RELEASE_PACKAGE_NAME;
            const version = process.env.VERSION;
            if (!releasePackageName || !version) {
              throw new Error("RELEASE_PACKAGE_NAME and VERSION must be set.");
            }
            const runtimeDependencies = {
              "@opentui/core": "0.1.90",
              "ws": "8.20.0"
            };
            const runtimeOptionalDependencies = {
              "@opentui/core-darwin-arm64": "0.1.90",
              "@opentui/core-darwin-x64": "0.1.90",
              "@opentui/core-linux-arm64": "0.1.90",
              "@opentui/core-linux-x64": "0.1.90",
              "@opentui/core-win32-arm64": "0.1.90",
              "@opentui/core-win32-x64": "0.1.90"
            };
            const next = {
              name: releasePackageName,
              version,
              type: source.type,
              description: source.description,
              author: source.author,
              license: source.license,
              repository: source.repository,
              homepage: source.homepage,
              bugs: source.bugs,
              keywords: source.keywords,
              bin: source.bin,
              dependencies: runtimeDependencies,
              optionalDependencies: runtimeOptionalDependencies,
              files: ["dist", "README.md", "CHANGELOG.md"],
            };
            const compact = Object.fromEntries(Object.entries(next).filter(([, value]) => value !== undefined));
            await Bun.write(outPath, `${JSON.stringify(compact, null, 2)}\n`);
          '

      - name: Configure npm authentication
        run: |
          set -euo pipefail

          if [ -z "${AZDEVOPS_ORGANIZATION:-}" ] || [ -z "${AZDEVOPS_PROJECT:-}" ] || [ -z "${AZDEVOPS_PACKAGEFEED:-}" ]; then
            echo "Missing Azure DevOps registry settings. Set AZDEVOPS_ORGANIZATION, AZDEVOPS_PROJECT, and AZDEVOPS_PACKAGEFEED in the tapioone-azdevops environment."
            exit 1
          fi

          TOKEN="${AZDEVOPS_PAT}"
          if [ -z "$TOKEN" ]; then
            echo "Missing publish token. Set AZDEVOPS_PAT in the tapioone-azdevops environment."
            exit 1
          fi

          FEED_PATH="pkgs.dev.azure.com/${AZDEVOPS_ORGANIZATION}/_packaging/${AZDEVOPS_PACKAGEFEED}/npm"
          NPM_FEED_REGISTRY="https://${FEED_PATH}/registry/"
          TOKEN_B64="$(printf '%s' "$TOKEN" | base64 | tr -d '\n')"

          echo "NPM_FEED_REGISTRY=${NPM_FEED_REGISTRY}" >> "$GITHUB_ENV"

          cat > publish/.npmrc <<EOF
          ${NPM_SCOPE}:registry=${NPM_FEED_REGISTRY}
          always-auth=true
          //${FEED_PATH}/registry/:username=github
          //${FEED_PATH}/registry/:_password=${TOKEN_B64}
          //${FEED_PATH}/registry/:email=github-actions@users.noreply.github.com
          //${FEED_PATH}/:username=github
          //${FEED_PATH}/:_password=${TOKEN_B64}
          //${FEED_PATH}/:email=github-actions@users.noreply.github.com
          EOF

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.release_version }}" bun --eval '
            const version = process.env.VERSION;
            if (!version) {
              throw new Error("VERSION must be set.");
            }
            const changelog = await Bun.file("packages/release/CHANGELOG.md").text();
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = changelog.match(new RegExp(`##\\s+${escaped}\\n([\\s\\S]*?)(?=\\n##\\s+|$)`));
            if (!match) {
              throw new Error(`Could not find changelog entry for ${version}.`);
            }
            await Bun.write("release-notes.md", `${match[1].trim()}\n`);
          '

      - name: Publish package
        run: |
          set -euo pipefail
          cd publish
          npm publish --registry "$NPM_FEED_REGISTRY"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "release/v${{ needs.prepare.outputs.release_version }}" \
            --title "@tapio/release v${{ needs.prepare.outputs.release_version }}" \
            --notes-file release-notes.md
